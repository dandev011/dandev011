<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img" aria-labelledby="title desc">
  <title id="title">Terminal de apresentação de Danilo</title>
  <desc id="desc">Um painel tecnológico com as informações profissionais de Danilo e Real Mídia Center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#ff9238"/>
      <stop offset=".55" stop-color="#67b7ff"/>
      <stop offset="1" stop-color="#67b7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1180" height="530" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1178" height="528" rx="17" fill="none" stroke="#293344" stroke-width="2"/>
  <path d="M0 75H1180" stroke="#293344" stroke-width="2"/>
  <circle cx="38" cy="38" r="8" fill="#ff6b5e"/>
  <circle cx="66" cy="38" r="8" fill="#ffc15d"/>
  <circle cx="94" cy="38" r="8" fill="#5ecf8d"/>
  <text x="590" y="44" text-anchor="middle" fill="#9aa8bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">danilo@real-midiacenter: ~</text>
  <path d="M44 104H1136" stroke="url(#line)" stroke-width="2"/>
  <text x="54" y="151" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">$ whoami</text>
  <text x="54" y="197" fill="#f0f5fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700">Danilo</text>
  <text x="54" y="230" fill="#ff9238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">DIGITAL SOLUTIONS · SOFTWARE · CREATIVE TECHNOLOGY</text>
  <path d="M54 262H1126" stroke="#293344" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="54" y="309" fill="#ff9238">AGENCY</text><text x="270" y="309" fill="#e8eef8">Real Mídia Center</text>
    <text x="54" y="350" fill="#ff9238">WEB</text><text x="270" y="350" fill="#67b7ff">realmidiacenter.com</text>
    <text x="54" y="391" fill="#ff9238">DEV</text><text x="270" y="391" fill="#67b7ff">dev.realmidiacenter.com</text>
    <text x="54" y="432" fill="#ff9238">CONTACT</text><text x="270" y="432" fill="#67b7ff">contato@realmidiacenter.com</text>
  </g>
  <g transform="translate(813 290)">
    <rect width="275" height="156" rx="12" fill="#0b0d12" stroke="#314056"/>
    <text x="22" y="38" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SYSTEM.STATUS</text>
    <path d="M22 55H253" stroke="#293344"/>
    <circle cx="31" cy="86" r="6" fill="#ff9238" filter="url(#glow)"/>
    <text x="49" y="92" fill="#e8eef8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">BUILDING</text>
    <circle cx="31" cy="119" r="6" fill="#67b7ff" filter="url(#glow)"/>
    <text x="49" y="125" fill="#e8eef8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">OPEN TO IDEAS</text>
  </g>
  <text x="54" y="491" fill="#718198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">$ build --with-purpose</text>
  <rect x="293" y="476" width="12" height="20" rx="1" fill="#ff9238"/>
